    - .dantecode/skills
    - ~/.dantecode/skills
  autoImport: false
  constitutionEnforced: true
  antiStubEnabled: true
agents:
  maxConcurrent: 4
  nomaEnabled: true
  fileLockingEnabled: true
  defaultLane: lead
audit:
  enabled: true
  logDirectory: .dantecode
  retentionDays: 90
  includePayloads: true
  sensitiveFieldMask:
    - apiKey
    - token
    - secret
    - password
sessionHistory: []
lessons:
  enabled: true
  maxPerProject: 500
  autoInject: true
  minSeverity: warning
project:
  name: ""
  language: ""
  sourceDirectories:
    - src
  excludePatterns:
    - node_modules/
    - dist/
    - .next/
    - __pycache__/
    - .dantecode/worktrees/
