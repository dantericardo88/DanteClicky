<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DanteClicky Bridge</title>
<style>
  body { font-family: system-ui, sans-serif; width: 280px; padding: 12px; margin: 0; font-size: 13px; }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  .status { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #888; }
  .dot.online { background: #4ec9b0; }
  .dot.offline { background: #f48771; }
  .info { color: #555; font-size: 12px; word-break: break-all; }
  button { background: #4ec9b0; color: #fff; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 12px; margin-top: 8px; width: 100%; }
  button:hover { background: #3aaf96; }
</style>
</head>
<body>
<h1>DanteClicky Bridge</h1>
<div class="status">
  <div class="dot" id="dot"></div>
  <span id="status">Checking…</span>
</div>
<div class="info" id="info"></div>
<button id="send">Send Current Tab Now</button>
<script src="popup.js"></script>
</body>
</html>
