[package]
name = "dante-clicky-windows"
version = "0.1.0"
description = "DanteClicky - AI Companion for Windows"
authors = ["DanteForge Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/dantericardo88/DanteClicky"
homepage = "https://github.com/dantericardo88/DanteClicky"
readme = "../README.md"

[lib]
name = "dante_clicky_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase 2 -- Screen capture
screenshots = "0.8"
image = { version = "0.24", default-features = false, features = ["jpeg"] }
base64 = "0.22"
rayon = "1"

# Phase 3 -- Audio input
cpal = "0.15"

# Phase 6 -- Win32 cursor animation (0.61 aligns with Tauri 2.11 to avoid windows-core trait conflicts)
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation_Collections",
] }

# Phase 7 -- Auto-start on Windows login + auto-update
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

# Phase 8 -- Computer-use input control
enigo = "0.2"

# Phase 9 -- DanteAgents WebSocket bridge
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Phase P1-B -- MCP server (HTTP + SSE on port 9002)
axum = { version = "0.7", features = ["macros"] }
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"

# Phase 10 -- Direct API proxy (removes Cloudflare Worker dependency)
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# Dimension 1 -- Persistent Memory (SQLite with FTS5)
# Use --features sqlcipher for production builds (adds SQLCipher AES-256 file-level encryption)
# Tests run with plain bundled SQLite (no OpenSSL/Perl required)
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"

# Dimension 36 -- Memory encryption at rest (SQLCipher AES-256 file-level + ChaCha20-Poly1305 field-level)
chacha20poly1305 = "0.10"
rand = "0.8"

# Dimension 3 -- Local Whisper STT via candle (pure Rust, no cmake, always in default binary)
candle-core = { version = "0.8", default-features = false }
candle-nn = { version = "0.8", default-features = false }
candle-transformers = { version = "0.8", default-features = false }
tokenizers = "0.20"

# Dimension 4 -- Local TTS via Kokoro ONNX
# Enable with: cargo build --features local-tts
# ort downloads ONNX Runtime DLLs automatically (no cmake needed)
ort = { version = "2.0.0-rc.12", features = ["download-binaries"], optional = true }

[features]
local-tts = ["ort"]
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
